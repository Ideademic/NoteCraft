[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/notecraft", "apps/notecraft-cli", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Ideademic/NoteCraft"

# Every dependency any crate needs is declared here, so crates only say `{ workspace = true }`.
# Licence allowlist (AGENTS.md): MIT, Apache-2.0, BSD-2/3-Clause, ISC, OFL-1.1, CC0-1.0. No MPL.
[workspace.dependencies]
# internal
notecraft-geom = { path = "crates/geom" }
notecraft-doc = { path = "crates/doc" }
notecraft-onestore = { path = "crates/onestore" }
notecraft-one = { path = "crates/one" }
notecraft-onepkg = { path = "crates/onepkg" }
notecraft-formats = { path = "crates/formats" }
notecraft-printout = { path = "crates/printout" }
notecraft-pdf = { path = "crates/pdf" }
notecraft-engine = { path = "crates/engine" }
notecraft-ui-egui = { path = "crates/ui-egui" }
notecraft-fonts = { path = "crates/fonts" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (AGENTS.md). No `clock` feature: the current time
# comes from `web-time` (works in the browser too), see `notecraft_doc::now`.
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
# Random GUIDs (`notecraft_doc::Guid::new`). On wasm32 the crates add the `wasm_js` feature.
getrandom = "0.3"
# Binary payloads (pictures, printouts, embedded files) in the JSON form of the model.
base64 = "0.22"
proptest = "1"

# formats
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# `.onepkg` is a Microsoft Cabinet file (MIT, pure Rust: none/MSZIP/LZX read, MSZIP write).
cab = "0.6"
# CRCs (RFC 3309 for .one, MsoCrc32 for .onetoc2) are hand-rolled in notecraft-onestore from the
# public specs: no crate needed.
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0", default-features = false, features = ["raster", "write"] }
# PDF export (notecraft-pdf): text is laid out with epaint's CPU fonts (the canvas's line
# breaks) without egui; skrifa (MIT OR Apache-2.0, epaint's version) maps characters to glyphs
# for the PDF text; installed fonts come from craft-font-catalog at craft-ui's rev.
epaint = { version = "0.37", default-features = false }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# The shaper epaint lays text out with (MIT), at its version: the PDF writes the same glyphs
# (ligatures, kerning, marks) the canvas draws.
harfrust = "0.15"
# Geometry types of craft-pdf's interpreter (tests that read exported PDFs back).
kurbo = "0.13"
craft-font-catalog = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
# Desktop printing: CUPS `lp` and the Windows spooler, at craft-ui's rev (its printing panel).
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }

# fonts (notecraft-fonts: craft-font-catalog and skrifa above serve it too)
# WOFF / WOFF2 fonts added in the browser (MIT); its brotli decoder, used ahead of it so a
# hostile file's glyph point counts are checked first (BSD-3-Clause OR MIT; already in the lock).
wuff = "0.2.9"
brotli-decompressor = "5"

# ui (same versions and craft-libs revs as WordCraft)
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# egui's bundled faces, as real font files in tests.
epaint_default_fonts = "0.37"
# A clock that works on native and in the browser (`performance.now()`, `Date.now()`).
web-time = "1.1"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", features = ["egui"] }
# Release checks, the update prompt and the self-update, at WordCraft's rev (desktop only).
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0", features = ["egui"] }
# Native file dialogs that never block the event loop (rfd's modal loop re-enters winit on macOS
# and aborts the app). Desktop only.
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0" }
craft-web-host = { git = "https://github.com/storytold/craft-libs", rev = "2e2312ddaf21bc3d85cd3395d0955c7d239306f6", version = "0.1.0" }
# Spelling (Review tab), at craft-web-host's rev. English comes from SCOWL when the build has
# craft-i18n's language data (CRAFT_I18N_DIR), else from the built-in public-domain Moby list;
# other languages from installed Hunspell dictionaries. Builds for wasm32.
craft-proof = { git = "https://github.com/storytold/craft-libs", rev = "2e2312ddaf21bc3d85cd3395d0955c7d239306f6" }
# Desktop: open attachments and links with the system's app for them (MIT; already in the lock).
open = "5"

# web
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Storage", "Location"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "deny"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces; full debug info
# for every test binary and dependency would multiply the target dir size.
# The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[patch.crates-io]
# Required by craft-pdf: the backend rejects writers that failed during unwinding.
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
# craft-pdf's `raster` feature renders with the hayro crates craft-libs vendors (and patches in its
# own workspace); consumers patch them to the same vendored copies at the same rev.
hayro = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
