# Flatpak manifest for the single-file bundle attached to every GitHub release
# (notecraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (notecraft-<version>-linux-<arch>.tar.gz,
# built on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, a few seconds instead of 20+ minutes,
# and byte-for-byte the same binaries as the AppImage/deb/rpm. The script unpacks the tarball
# into `stage/` next to a copy of this file. The binaries need glibc >= 2.35 and load X11,
# Wayland, xkbcommon and Vulkan at runtime; the freedesktop runtime has all of them, and the
# GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# com.ideademic.notecraft.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime, runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: com.ideademic.notecraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: notecraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open dialogs go through the file-chooser portal (rfd's xdg-portal backend) and drag-and-drop
  # through the document portal. Notebooks are folders that NoteCraft autosaves into, so the
  # usual document folders are granted read-write; pictures and PDFs for printouts are read
  # from Pictures and Downloads.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-download:ro
  # Deliberately not granted: network access and home/host filesystem access.
modules:
  - name: notecraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/notecraft /app/bin/notecraft
      - install -Dm755 bin/notecraft-cli /app/bin/notecraft-cli
      - install -Dm644 share/applications/com.ideademic.notecraft.desktop /app/share/applications/com.ideademic.notecraft.desktop
      - install -Dm644 share/mime/packages/com.ideademic.notecraft.xml /app/share/mime/packages/com.ideademic.notecraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/com.ideademic.notecraft.metainfo.xml /app/share/metainfo/com.ideademic.notecraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/notecraft /app/share/doc/
    sources:
      - type: dir
        path: stage
