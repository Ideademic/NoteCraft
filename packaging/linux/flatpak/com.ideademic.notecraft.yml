# Flatpak manifest for NoteCraft, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/com.ideademic.notecraft.yml
#   flatpak run com.ideademic.notecraft
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The release's .flatpak bundles come from com.ideademic.notecraft.bundle.yml instead (see there);
# keep runtime, runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: com.ideademic.notecraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: notecraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open dialogs go through the file-chooser portal (rfd's xdg-portal backend) and drag-and-drop
  # through the document portal. Notebooks are folders that NoteCraft autosaves into, so the
  # usual document folders are granted read-write; pictures and PDFs for printouts are read
  # from Pictures and Downloads.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-download:ro
  # Deliberately not granted: network access and home/host filesystem access.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: notecraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/notecraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p notecraft -p notecraft-cli
      - install -Dm755 target/release/notecraft /app/bin/notecraft
      - install -Dm755 target/release/notecraft-cli /app/bin/notecraft-cli
      - install -Dm644 NOTICE /app/share/doc/notecraft/NOTICE
      - install -Dm644 packaging/linux/com.ideademic.notecraft.desktop /app/share/applications/com.ideademic.notecraft.desktop
      - install -Dm644 packaging/linux/com.ideademic.notecraft.mime.xml /app/share/mime/packages/com.ideademic.notecraft.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/com.ideademic.notecraft.metainfo.xml.in > /app/share/metainfo/com.ideademic.notecraft.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
