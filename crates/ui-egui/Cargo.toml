[package]
name = "notecraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NoteCraft egui front end (OneNote 2016-style ribbon, notebook pane, section tabs, page list, page canvas); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
notecraft-geom = { workspace = true }
notecraft-doc = { workspace = true }
notecraft-engine = { workspace = true }
egui = { workspace = true, features = ["default_fonts"] }
egui_extras = { workspace = true }
craft-ui = { workspace = true }
craft-i18n = { workspace = true }
craft-window = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
image = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
