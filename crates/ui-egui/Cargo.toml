[package]
name = "notecraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NoteCraft egui front end (OneNote 2016-style ribbon, notebook pane, section tabs, page list, page canvas); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
notecraft-geom = { workspace = true }
notecraft-doc = { workspace = true }
notecraft-engine = { workspace = true }
# Pictures as their rotated and cropped pixels, and HTML for the system clipboard.
notecraft-formats = { workspace = true }
# The Print page's preview (sheet pictures) and paper sizes.
notecraft-pdf = { workspace = true }
egui = { workspace = true, features = ["default_fonts"] }
egui_extras = { workspace = true }
# `system_fonts`: installed fonts for characters a note's font lacks (other scripts), desktop only.
craft-ui = { workspace = true, features = ["system_fonts"] }
# The installed, bundled and added fonts the canvas draws with (`fonts`).
notecraft-fonts = { workspace = true }
craft-i18n = { workspace = true }
craft-window = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
# Page dates in the host's time zone (`CanvasState::utc_offset_minutes`).
chrono = { workspace = true }
image = { workspace = true }
# Files picked in the browser travel to the engine as base64 (`bytesBase64` params).
base64 = { workspace = true }

# Release checks, the update prompt and the self-update (desktop only; the web build has nothing
# to update).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }

[dev-dependencies]
# Headless window tests and the `ui_shot` example (renders PNGs offscreen with wgpu).
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# egui's Hack as a real font file the font tests add as a user font.
epaint_default_fonts = { workspace = true }
