<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#c44df0">
  <title>NoteCraft</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/notecraft.ico" />
  <link data-trunk rel="copy-file" href="../../assets/app-icon/hicolor/128x128/apps/com.ideademic.notecraft.png" />
  <link data-trunk rel="rust" data-bin="notecraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    :root { --accent: #c44df0; --accent-ink: #8a22b8; --page: #f3f2f1; --text: #3b3a39; --muted: #6b6a69; --track: #e1dfdd; }
    @media (prefers-color-scheme: dark) {
      :root { --page: #1f1f1f; --text: #f3f2f1; --muted: #b3b0ad; --track: #3b3a39; }
    }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--page); }
    #notecraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* Loading screen: the app's title bar colour across the top, the icon and the name centred,
       a flat indeterminate bar. Removed by the app once it runs. */
    #notecraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: var(--page); color: var(--text); font: 14px "Segoe UI", system-ui, -apple-system, sans-serif; }
    #notecraft_loading::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 30px; background: var(--accent); }
    #notecraft_loading img { width: 72px; height: 72px; }
    #notecraft_loading .name { font-size: 26px; font-weight: 300; letter-spacing: 0.01em; color: var(--accent); }
    @media (prefers-color-scheme: dark) { #notecraft_loading .name { color: #d98af5; } }
    #notecraft_loading .bar { position: relative; width: 180px; height: 3px; overflow: hidden; background: var(--track); border-radius: 2px; }
    #notecraft_loading .bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--accent);
      animation: notecraft-slide 1.1s ease-in-out infinite; }
    #notecraft_status { color: var(--muted); min-height: 1.2em; text-align: center; max-width: 34em; padding: 0 16px; }
    #notecraft_loading.failed .bar { display: none; }
    #notecraft_loading.failed #notecraft_status { color: var(--text); }
    @keyframes notecraft-slide { from { left: -40%; } to { left: 100%; } }
    @media (prefers-reduced-motion: reduce) { #notecraft_loading .bar::after { animation: none; left: 30%; } }
  </style>
</head>
<body>
  <canvas id="notecraft_canvas"></canvas>
  <div id="notecraft_loading" role="status" aria-live="polite">
    <img src="com.ideademic.notecraft.png" alt="">
    <div class="name">NoteCraft</div>
    <div class="bar"></div>
    <div id="notecraft_status">Loading your notebooks&hellip;</div>
    <noscript>NoteCraft runs in your browser with WebAssembly: turn on JavaScript to use it.</noscript>
  </div>
</body>
</html>
