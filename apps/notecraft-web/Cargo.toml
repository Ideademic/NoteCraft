[package]
name = "notecraft-web"
description = "NoteCraft in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "notecraft-web"
path = "src/main.rs"

[dependencies]
notecraft-doc = { workspace = true }
notecraft-engine = { workspace = true }
notecraft-one = { workspace = true }
# A hosted notebook travels to the hosting page as one `.onepkg` (`host`).
notecraft-onepkg = { workspace = true }
notecraft-ui-egui = { workspace = true }
# The host messages (storytold/craft-libs): one contract and one bridge for the web builds.
craft-web-host = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
# On top of the workspace's features: storage, the file picker, the clipboard, the leave guard.
web-sys = { workspace = true, features = [
  "BeforeUnloadEvent", "Clipboard", "ClipboardEvent", "ClipboardItem", "CssStyleDeclaration", "DataTransfer", "DomException",
  "DomStringList", "Event", "HtmlIFrameElement", "EventTarget", "File", "FileList", "HtmlInputElement", "IdbDatabase", "IdbFactory", "IdbObjectStore",
  "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "MediaQueryList", "Navigator",
] }
