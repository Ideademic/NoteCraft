[package]
name = "notecraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "notecraft"
description = "NoteCraft desktop app"

[lints]
workspace = true

[dependencies]
notecraft-doc = { workspace = true }
notecraft-engine = { workspace = true }
notecraft-ui-egui = { workspace = true }
# Who draws the window frame (the desktop, or the app on GNOME's Wayland session).
craft-window = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "wayland", "x11", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The local UTC offset for dates under page titles and Insert Date/Time: chrono's `clock` feature
# (iana-time-zone, MIT OR Apache-2.0), enabled for the desktop app only.
chrono = { workspace = true, features = ["clock"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
# Pictures on the system clipboard (screenshots); egui's paste only carries text.
arboard = { workspace = true, features = ["image-data"] }

[build-dependencies]
# Icon + VERSIONINFO for notecraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"
